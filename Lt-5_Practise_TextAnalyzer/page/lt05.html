<!DOCTYPE html>
<html lang="eng">
    <head>
        <title>Text Analyzer</title>
        <link rel="stylesheet" href="../Design/lt05Style.css" >
    </head>
    <body>
        <div class="container">
            <h1> Text Analyzer </h1>
            <textarea id="textInput" rows="10" cols="60" placeholder="Paste your text here..."></textarea>
            <br><br>
            <button id = "analyzeButton"> Analyze Text </button>
            <br><br>
            <div id="result">
                <p id="charCount">Character Count:</p>
                <p id="wordCount">Word Count:</p>
                <p id="reverseText">Reversed Text:</p>
            </div>
        </div>
    </body>
</html>
