<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Booking Form</title>
</head>
<body>

<h2>Conference Event Booking</h2>

<form id="bookingForm">

    <!-- Full Name -->
    <label>Full Name:</label><br>
    <input type="text" id="name"><br>
    <span id="nameError" style="color:red;"></span><br><br>

    <!-- Email -->
    <label>Email Address:</label><br>
    <input type="email" id="email"><br>
    <span id="emailError"></span><br><br>

    <!-- Tickets -->
    <label>Number of Tickets:</label><br>
    <input type="number" id="tickets"><br>
    <span id="ticketError"></span><br><br>

    <!-- Event Type -->
    <label>Event Type:</label><br>
    <select id="eventType">
        <option value="">--Select--</option>
        <option value="Workshop">Workshop</option>
        <option value="Seminar">Seminar</option>
        <option value="Networking">Networking</option>
    </select><br>
    <span id="typeError" style="color:red;"></span><br><br>

    <!-- Event Date -->
    <label>Event Date:</label><br>
    <input type="date" id="eventDate"><br>
    <span id="dateError" style="color:red;"></span><br><br>

    <!-- Checkbox -->
    <input type="checkbox" id="terms"> I agree to terms<br>
    <span id="termsError" style="color:red;"></span><br><br>

    <button type="submit">Book Now</button>

</form>

<script src="../problem 4(note)/script.js"></script>

</body>
</html>
