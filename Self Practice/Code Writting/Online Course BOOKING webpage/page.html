<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Course Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Learning Portal</h1>
    </header>

    <main>
        <div class="container">
            <!-- Course Enrollment Panel -->
            <fieldset id="course-panel">
                <legend>Course Enrollment Panel</legend>
                <p>Course: JavaScript Fundamentals</p>
                <p>Fee per seat: 500 Tk</p>
                <label for="seats">Number of seats: </label>
                <input type="number" id="seats" name="seats" value="1" min="1">
                <p id="total-fee">Total Fee: 500 Tk</p>
                <p id="course-message"></p>
            </fieldset>

            <!-- Enrollment Details Form -->
            <fieldset id="details-panel">
                <legend>Enrollment Details Form</legend>
                <label for="fullName">Full Name: </label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">
                <br><br>
                <label for="email">Email: </label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
                <br><br>
                <label for="class-type">Class Type: </label>
                <select id="class-type">
                    <option value="online">Online Class</option>
                    <option value="onsite">On-Campus Class</option>
                </select>
                <p id="final-amount">Final Amount: 500 Tk</p>
                <label>
                    <input type="checkbox" id="confirm"> I confirm my enrollment details are correct
                </label>
                <br><br>
                <button id="submit-btn" style="display:none;">Submit</button>
            </fieldset>
        </div>
    </main>

    <footer>
        All Rights Reserved 2026
    </footer>

    <script src="script.js"></script>
</body>
</html>
